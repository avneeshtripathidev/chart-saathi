name: ChartSaathi CI & Android APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  backend-verification:
    name: Backend (Typecheck, Build & Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package.json'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run TypeScript typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Build Fastify backend
        working-directory: backend
        run: npm run build

      - name: Run Backend Jest Tests
        working-directory: backend
        env:
          PORT: 3001
          NODE_ENV: test
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-key
          CHART_PROVIDER: mock
          CORS_ORIGINS: http://localhost:8081
        run: npm test

  mobile-verification:
    name: Mobile / Web (Typecheck & Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'mobile/package.json'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Run TypeScript typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Run Mobile Jest Tests
        working-directory: mobile
        run: npm test

  build-android-apk:
    name: Build Android APK
    needs: [mobile-verification]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'mobile/package.json'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Prebuild Android native project
        working-directory: mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://hmqnohcambgqxesewaac.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhtcW5vaGNhbWJncXhlc2V3YWFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMDY5NDAsImV4cCI6MjEwODY4Mjk0MH0.MKmZslc_rUf9aWgXXQKUVA4D3UsMQ91eU5D66XgFdZY' }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://chart-saathi-game1-7741.vercel.app' }}
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK with Gradle
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ChartSaathi-Android-APK
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
